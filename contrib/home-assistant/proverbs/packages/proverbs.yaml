# Package: enable with homeassistant.packages (see ../README.md).
command_line:
  - sensor:
      name: Proverb
      unique_id: awtrix_proverb
      command: "shuf -n 1 /config/proverbs.txt | tr -d '\\r'"
      # Slice in Jinja, not cut: 250 Unicode characters, not 250 bytes.
      value_template: "{{ value[:250] }}"
      scan_interval: 31536000
      command_timeout: 10

input_boolean:
  proverb_notify:
    name: Proverb notification
    initial: false

input_number:
  proverb_interval_s:
    name: Proverb interval
    min: 10
    max: 3600
    step: 1
    initial: 96
    unit_of_measurement: s
    mode: box

timer:
  proverb_pacing:
    name: Proverb pacing

# Refresh both colours once per selected proverb, before enabling the toggle.
template:
  - triggers:
      - trigger: event
        event_type: proverb_colours_refresh
    sensor:
      - name: Proverb text color
        unique_id: awtrix_proverb_text_color
        state: >-
          {{ [[255, 0, 0], [0, 255, 0], [255, 255, 0],
              [255, 0, 255], [0, 255, 255], [255, 255, 255]] | random }}
        attributes:
          generation: "{{ trigger.event.data.generation }}"
      - name: Proverb background color
        unique_id: awtrix_proverb_background_color
        state: "{{ [0, 0, 255] if range(7) | random == 0 else [0, 0, 0] }}"
        attributes:
          generation: "{{ trigger.event.data.generation }}"

automation:
  - id: awtrix_proverb_pacing
    alias: AWTRIX proverb pacing
    mode: single
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.proverb_pacing
    variables:
      # CHANGE HERE ONLY if your office uses another motion entity.
      motion_entity: binary_sensor.upstairs_office_motion_aqara_motion
    actions:
      # Restart before checking motion: inactivity must not stop the clock.
      - action: timer.start
        target:
          entity_id: timer.proverb_pacing
        data:
          duration: "{{ states('input_number.proverb_interval_s') | int(96) + range(16) | random }}"
      - condition: template
        value_template: >-
          {% set motion = expand(motion_entity) | first | default(none) %}
          {{ motion is not none and motion.state in ['on', 'off'] and
             (motion.state == 'on' or
              (as_timestamp(now()) - as_timestamp(motion.last_changed)) < 7200) }}
      - action: homeassistant.update_entity
        target:
          entity_id: sensor.proverb
      - condition: template
        value_template: "{{ has_value('sensor.proverb') and states('sensor.proverb') | trim != '' }}"
      - variables:
          colour_generation: "{{ now().isoformat() }}"
      - event: proverb_colours_refresh
        event_data:
          generation: "{{ colour_generation }}"
      - wait_template: >-
          {{ state_attr('sensor.proverb_text_color', 'generation') == colour_generation and
             state_attr('sensor.proverb_background_color', 'generation') == colour_generation }}
        timeout: '00:00:05'
        continue_on_timeout: false
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.proverb_notify
      # Give the independently running blueprint time to process dismissal.
      - delay: '00:00:01'
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.proverb_notify
